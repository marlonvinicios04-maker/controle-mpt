<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Controle de Materiais MPT – Actemium</title>
<meta name="theme-color" content="#0b5cad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa;--surface:#ffffff;--surface2:#f8fafc;--line:#e2e8f0;--line2:#cbd5e1;
  --text:#0f1b2d;--muted:#5b6b80;--faint:#94a3b8;
  --pri:#0b5cad;--pri2:#0a4d91;--priSoft:#e7f0fb;
  --in:#0f8a5f;--inSoft:#e5f5ee;--out:#c2570c;--outSoft:#fdf0e6;--warn:#b7791f;--warnSoft:#fdf6e3;
  --red:#c42b2b;--redSoft:#fdecec;--violet:#6941c6;--violetSoft:#f1ecfb;
  --r:14px;--sh:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--pri)}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:236px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{max-height:30px;max-width:120px;object-fit:contain}
.wordmark{font-weight:800;letter-spacing:.06em;color:var(--pri);font-size:17px}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--priSoft);color:var(--pri);font-weight:600}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .nm{font-weight:600;font-size:13px;line-height:1.2}.me .rl{font-size:11.5px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none}
.content{padding:26px 30px 40px;max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.bnav{display:none}
/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:600}
.card h3 small{color:var(--muted);font-weight:500;margin-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2)}
.btn.o{background:var(--out);border-color:var(--out);color:#fff}.btn.o:hover{filter:brightness(.95)}
.btn.g{background:var(--in);border-color:var(--in);color:#fff}
.btn.d{color:var(--red);border-color:#f1c4c4}.btn.d:hover{background:var(--redSoft)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.f label .req{color:var(--red)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:border .15s,box-shadow .15s}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(11,92,173,.13)}
.in[readonly]{background:var(--surface2);color:var(--muted)}
textarea.in{min-height:76px;resize:vertical}
.sec{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.est{background:var(--inSoft);color:var(--in)}
.chip.par{background:var(--warnSoft);color:var(--warn)}
.chip.bx{background:#eef1f5;color:#475569}
.chip.ap{background:var(--priSoft);color:var(--pri)}
.chip.em{background:var(--violetSoft);color:var(--violet)}
.chip.tr{background:var(--outSoft);color:var(--out)}
.chip.dv{background:#e3f4f1;color:#0f766e}
.chip.rc{background:var(--redSoft);color:var(--red)}
.chip.adm{background:var(--priSoft);color:var(--pri)}
.chip.off{background:var(--redSoft);color:var(--red)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-variant-numeric:tabular-nums}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lb i{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi .vl{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .sb{font-size:12px;color:var(--muted);margin-top:3px}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f9fbfe}
.tbl .desc{font-weight:600;max-width:340px}
.tbl .desc small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.tbl input[type=checkbox]{width:17px;height:17px;accent-color:var(--pri)}
.tw{overflow:auto;border-radius:var(--r)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
/* bars */
.hb{display:grid;grid-template-columns:minmax(70px,130px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:500}
.hb .tr{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;border-radius:6px}
.hb b{font-variant-numeric:tabular-nums;font-size:12.5px;min-width:28px;text-align:right}
.stack{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--surface2);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart text{font-family:Inter,sans-serif;font-size:11px;fill:var(--muted)}
/* activity */
.act{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.act:last-child{border-bottom:0}
.act .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .ic.rec{background:var(--redSoft);color:var(--red)}.act .ic.in{background:var(--inSoft);color:var(--in)}.act .ic.out{background:var(--outSoft);color:var(--out)}
.act .tx{flex:1;min-width:0}
.act .tx b{font-weight:600}
.act .tx div{font-size:12.5px;color:var(--muted);margin-top:2px}
.act time{font-size:12px;color:var(--muted);white-space:nowrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(2px)}
.md{background:var(--surface);border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(15,27,45,.25);animation:pop .16s ease-out}
.md.lg{max-width:860px}
.md .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.md .mh h2{margin:0;font-size:17px}
.md .mb{padding:18px 20px}
.md .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.dl div small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:2px}
.dl div b{font-weight:600;word-break:break-word}
.dl .full{grid-column:1/-1}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos .ph1{width:92px;height:92px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--surface2)}
.photos .ph1 img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .ph1 button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(15,27,45,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.addph{width:92px;height:92px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;background:var(--surface2)}
.addph:hover{border-color:var(--pri);color:var(--pri)}
.hist{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;background:var(--surface2)}
.hist .hh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hist .hd{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#0f1b2d;color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;animation:pop .16s}
#toast div.err{background:var(--red)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#eaf1fb 0%,#f6f8fb 55%,#eef6f2 100%)}
.login .card{width:100%;max-width:400px;padding:30px 28px}
.login .lg{text-align:center;margin-bottom:22px}
.login .lg img{max-height:46px;max-width:200px;object-fit:contain}
.login .lg .wordmark{font-size:26px}
.login h2{margin:14px 0 4px;font-size:19px}
.login p{margin:0;color:var(--muted);font-size:13px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.note{background:var(--priSoft);color:#1d4f86;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.note.w{background:var(--warnSoft);color:#7a5414}
/* label preview */
.lbl{width:100%;max-width:400px;aspect-ratio:100/70;border:1.5px solid #333;border-radius:8px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;font-size:9px;color:#000}
.lbl .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:5px}
.lbl .lh img{max-height:22px;max-width:110px;object-fit:contain}
.lbl .lh .t{text-align:right;font-weight:700;font-size:9px}.lbl .lh .t small{display:block;font-weight:400;font-size:7.5px}
.lbl .lb2{display:flex;gap:8px;flex:1;padding-top:5px;min-height:0}
.lbl .lf{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;align-content:start;min-width:0}
.lbl .lf div{min-width:0}
.lbl .lf small{display:block;font-size:6.5px;color:#666;text-transform:uppercase}
.lbl .lf b{display:block;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .lf .w{grid-column:1/-1}.lbl .lf .w b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lbl .lq{width:31%;text-align:center;font-weight:700;font-size:9px}
.lbl .lq svg{width:100%;height:auto;display:block}
.sel-bar{position:sticky;bottom:12px;z-index:5;margin-top:12px;background:#0f1b2d;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px rgba(15,27,45,.25)}
.sel-bar .btn{border-color:transparent}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:14px}
.searchw{position:relative}.searchw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchw .in{padding-left:36px}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.imgview{max-width:100%;max-height:80vh;display:block;margin:auto;border-radius:12px}
.pill-tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.pill-tabs button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.pill-tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.sheet .mb button.lnk{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500;font-size:15px;text-align:left}
.sheet .mb button.lnk:last-child{border-bottom:0}

/* responsive */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .top .brand{padding:0}
  .content{padding:16px 14px 96px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 2px;cursor:pointer;border-radius:10px}
  .bnav button.on{color:var(--pri)}
  .bnav button.plus span.pl{width:42px;height:42px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;margin-top:-14px;box-shadow:0 6px 16px rgba(11,92,173,.35)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .vl{font-size:20px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .fg.g3,.fg.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr 1fr}
  .filters .searchw{grid-column:1/-1}
  .ph h1{font-size:19px}
  /* table → cards */
  .tbl.rsp thead{display:none}
  .tbl.rsp,.tbl.rsp tbody,.tbl.rsp tr,.tbl.rsp td{display:block;width:100%}
  .tbl.rsp tr{padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
  .tbl.rsp td{border:0;padding:2px 0}
  .tbl.rsp td[data-l]:before{content:attr(data-l)": ";color:var(--muted);font-size:12px}
  .tbl.rsp td.ck{position:absolute;right:12px;top:12px;width:auto}
  .tbl.rsp td.desc{padding-right:34px;max-width:none}
  .tbl.rsp td.hm{display:none}
  .md{border-radius:16px}
  .ov{padding:10px 8px}
}
/* dashboard */
.hero{background:linear-gradient(120deg,#0a3f78 0%,#0b5cad 55%,#2a7fd4 100%);color:#fff;border-radius:18px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(11,92,173,.22);position:relative;overflow:hidden;margin-bottom:14px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{content:"";position:absolute;right:120px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero h1{margin:4px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85}.hero-d{font-size:12px;opacity:.75;text-transform:capitalize;font-weight:500}
.hero-r{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hb1{background:#fff;color:#0b5cad;border-color:#fff}.hero .hb1:hover{background:#eef5fd}
.hero .hb2{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}.hero .hb2:hover{background:rgba(255,255,255,.2)}
.dbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dbar .pill-tabs{background:#fff}
.dsel{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}.dsel select.in{width:auto;min-width:170px;padding:8px 12px}
.rng{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.kpi2{padding:16px 16px 14px;position:relative;overflow:hidden;border-top:3px solid var(--c)}
.kpi2 .kt{display:flex;align-items:center;gap:9px}
.kpi2 .kic{width:34px;height:34px;border-radius:10px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.kpi2 .klb{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.kpi2 .kvl{font-size:26px;font-weight:800;margin-top:12px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.kmoney{font-size:clamp(18px,2.2vw,26px)}
.kpi2 .ksb{font-size:12px;color:var(--muted);margin-top:2px}
.dg1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.dg2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.ch h3{margin:0}
.donutw{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;padding-top:6px}
.donut{width:150px;height:150px;flex:none}
.dleg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:10px}
.dleg div{display:grid;grid-template-columns:12px 1fr auto 42px;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.dleg i{width:10px;height:10px;border-radius:3px}.dleg span{font-weight:500}.dleg b{font-variant-numeric:tabular-nums}.dleg em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}

function donut(parts,total,lab){const R=52,C=2*Math.PI*R;const sum=parts.reduce((a,p)=>a+p[0],0);let off=0;
 const segs=sum?parts.filter(p=>p[0]>0).map(([v,c])=>{const len=v/sum*C;const g=parts.filter(p=>p[0]>0).length>1?2:0;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${Math.max(0,len-g)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join(''):'';
 return `<svg viewBox="0 0 140 140" class="donut"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#eef2f7" stroke-width="18"/>${segs}<text x="70" y="68" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#0f1b2d">${total}</text><text x="70" y="88" text-anchor="middle" style="font-size:11px;fill:#5b6b80">${lab}</text></svg>`}
function niceMax(v){let st=Math.max(1,Math.ceil(v/4));const p=Math.pow(10,Math.floor(Math.log10(st)));const n=st/p;st=(n<=1?1:n<=2?2:n<=5?5:10)*p;return st*4}
function chartBars(labels,series){
 const sm=window.innerWidth<600;const W=sm?360:620,H=sm?210:230,pl=30,pr=8,pt=14,pb=26,ih=H-pt-pb,iw=W-pl-pr;
 const mx=niceMax(Math.max(1,...series.flatMap(s=>s.v)));const cw=iw/labels.length;const bw=Math.min(26,cw*0.32);
 let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e2e8f0" ${i?'stroke-dasharray="3 4"':''}/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(mx*i/4)}</text>`}
 labels.forEach((l,i)=>{const cx=pl+cw*i+cw/2;series.forEach((s,j)=>{const v=s.v[i],h=v/mx*ih,x=cx-(series.length*bw+(series.length-1)*4)/2+j*(bw+4),y=pt+ih-h;
   g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h)}" rx="4" fill="${s.c}"><title>${s.n}: ${v}</title></rect>`;if(v)g+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:#0f1b2d;font-weight:600">${v}</text>`});
  g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

function afterEntrada(){

 if(S.editId&&!S._fotosLoaded&&!S._fotosLoading){const m=getMat(S.editId);if(m&&+m.fotos){S._fotosLoading=true;loadFotos(m).then(a=>{S.fotos=S._fotosDirty?[...a,...S.fotos].slice(0,4):a.slice();S._fotosLoaded=true;S._fotosLoading=false;renderFotos()}).catch(()=>{S._fotosLoading=false})}else S._fotosLoaded=true}

function formObj(f){const o={};['data','contrato','nf','nm','rt','ss','registro','plataforma','descricao','codigo','unidade','quantidade','valorUnit','local','observacao'].forEach(k=>o[k]=f[k].value);return o}

function compressImg(file,max=1100,q=0.72){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;let out='';let mx=max,qq=q;
  for(let k=0;k<6;k++){const r=Math.min(1,mx/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qq);if(out.length<190000)break;mx*=0.8;qq=Math.max(0.45,qq-0.07)}
  URL.revokeObjectURL(url);res(out)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Imagem inválida'))};img.src=url})}
function genCode(){const d=new Date();const p=(cfg().prefixo||'EST').toUpperCase();return `${p}-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`}
FORMS.entrada=async f=>{
 const o=formObj(f);o.descricao=o.descricao.trim();
 const q=num(o.quantidade);if(q<=0)return toast('Informe uma quantidade maior que zero.','err');
 const old=S.editId?getMat(S.editId):null;
 if(old){const out=sit(old).out;if(q<out)return toast(`Quantidade não pode ser menor que o total já baixado (${fmtN(out)}).`,'err')}
 o.codigo=(o.codigo||'').trim()||genCode();
 const dup=S.mats.find(x=>x.codigo&&x.codigo.toLowerCase()===o.codigo.toLowerCase()&&x.id!==S.editId);
 if(dup&&!(await confirmBox(`Já existe um material com o código ${o.codigo} (${dup.descricao}). Salvar mesmo assim?`)))return;
 const vu=num(o.valorUnit);
 const now=Date.now();
 const data={data:o.data,contrato:o.contrato.trim(),nf:o.nf.trim(),nm:o.nm.trim(),rt:o.rt.trim(),ss:o.ss.trim(),registro:o.registro.trim(),plataforma:o.plataforma.trim().toUpperCase(),descricao:o.descricao,unidade:(o.unidade.trim()||'UN').toUpperCase(),quantidade:q,valorUnit:vu,valorTotal:Math.round(q*vu*100)/100,local:o.local.trim(),codigo:o.codigo,observacao:o.observacao.trim()};
 const btn=$('#btnSalvar');btn.disabled=true;btn.textContent='Salvando…';
 try{
  let ref,doc;
  if(old){ref=S.db.doc('materiais/'+old.id);const base=Object.assign({},old);delete base.id;doc=Object.assign(base,data,{saidas:old.saidas.slice(),atualizadoPor:S.user.nome,atualizadoEm:now})}
  else{ref=S.db.collection('materiais').doc();doc=Object.assign(data,{saidas:[],criadoPor:S.user.nome,criadoUser:S.user.id,criadoEm:now})}
  const prevN=old?(+old.fotos||0):0;
  const fotosChanged=!old||S._fotosLoaded&&(S.fotos.length!==prevN||S._fotosDirty);
  if(fotosChanged){doc.fotos=S.fotos.length;doc.fotosV=now}else{doc.fotos=prevN}
  await retry(()=>ref.set(doc));
  if(fotosChanged){for(let i=0;i<S.fotos.length;i++)await retry(()=>S.db.doc('fotos/'+ref.id+'-'+i).set({img:S.fotos[i],mat:ref.id}));for(let i=S.fotos.length;i<prevN;i++)await S.db.doc('fotos/'+ref.id+'-'+i).delete().catch(()=>{})}
  toast(old?'Alterações salvas.':'Entrada registrada: '+data.codigo);
  const id=ref.id;S.form=null;S.fotos=[];S.editId=null;S._fotosLoaded=false;S._fotosDirty=false;
  S.view='estoque';updateChrome();renderView();setTimeout(()=>openDetail(id),150);
 }catch(e){wErr(e);if(btn.isConnected){btn.disabled=false;btn.textContent=old?'Salvar alterações':'Registrar entrada'}}
};

function repData(){
 const R=S.rep;const de=R.de||'0000',ate=R.ate||'9999';
 const recs=S.recusas.filter(r=>(!R.plat||r.plataforma===R.plat)&&(!R.ct||(r.contrato||'')===R.ct)&&(!(R.de||R.ate)||(r.data>=de&&r.data<=ate))).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
 const mats=S.mats.filter(m=>{const s=sit(m);if(R.plat&&m.plataforma!==R.plat)return false;if(R.ct&&(m.contrato||'')!==R.ct)return false;
  if(R.tipo==='estoque'&&s.saldo<=0)return false;if(R.tipo==='baixados'&&s.st!=='BAIXADO')return false;
  if((R.de||R.ate)&&R.tipo!=='baixados'&&!(m.data>=de&&m.data<=ate))return false;
  if((R.de||R.ate)&&R.tipo==='baixados'){const l=s.last;if(!l||!(l.data>=de&&l.data<=ate))return false}
  return true}).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
 const sds=[];mats.forEach(m=>sit(m).sd.forEach(x=>{if(!(R.de||R.ate)||(x.data>=de&&x.data<=ate))sds.push({m,x})}));
 sds.sort((a,b)=>(a.x.data||'').localeCompare(b.x.data||''));
 return {mats,sds,recs};
}

async function gerarExcel(){

 const H1=['DATA ENTRADA','CÓDIGO','CONTRATO','NF','NM','RT','SS','REGISTRO','PLATAFORMA','DESCRIÇÃO','UNIDADE','QTD ENTRADA','QTD SAÍDA','SALDO','VALOR UNITÁRIO','VALOR TOTAL','VALOR DO SALDO','LOCAL DE ARMAZENAMENTO','SITUAÇÃO','STATUS ATUAL','DATA ÚLTIMA SAÍDA','OBSERVAÇÃO','CADASTRADO POR'];
 const rows=mats.map(m=>{const s=sit(m);return [fmtD(m.data),m.codigo||'',m.contrato||'',m.nf||'',m.nm||'',m.rt||'',m.ss||'',m.registro||'',m.plataforma||'',m.descricao||'',m.unidade||'',+m.quantidade||0,s.out,s.saldo,+m.valorUnit||0,+m.valorTotal||0,Math.round(s.saldo*(+m.valorUnit||0)*100)/100,m.local||'',s.st,s.last?s.last.status:'EM ESTOQUE',s.last?fmtD(s.last.data):'',m.observacao||'',m.criadoPor||'']});
 const ws1=X.utils.aoa_to_sheet([H1,...rows]);
 fmtCols(X,ws1,rows.length,[14,15,16],[11,12,13]);
 ws1['!cols']=[12,16,14,12,12,12,12,12,14,42,9,11,10,10,14,14,14,24,13,15,14,30,18].map(w=>({wch:w}));
 ws1['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:H1.length-1}})};
 const H2=['DATA SAÍDA','CÓDIGO','CONTRATO','DESCRIÇÃO','PLATAFORMA','QUANTIDADE','UNIDADE','NF','NM','GRD','NF DE DEVOLUÇÃO','RT/FWO','STATUS','OP','OBSERVAÇÃO','NF ENTRADA','REGISTRADO POR'];
 const r2=sds.map(({m,x})=>[fmtD(x.data),m.codigo||'',m.contrato||'',m.descricao||'',m.plataforma||'',+x.quantidade||0,m.unidade||'',x.nf||'',x.nm||'',x.grd||'',x.nfDevolucao||'',x.rtFwo||'',x.status||'',x.op||'',x.observacao||'',m.nf||'',x.usuario||'']);
 const ws2=X.utils.aoa_to_sheet([H2,...r2]);fmtCols(X,ws2,r2.length,[],[5]);
 ws2['!cols']=[12,16,14,42,14,11,9,12,12,12,16,14,15,12,30,12,18].map(w=>({wch:w}));
 ws2['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:r2.length,c:H2.length-1}})};
 const H4=['DATA','NF','CONTRATO','FORNECEDOR','NM','PLATAFORMA','MATERIAL','QUANTIDADE','UNIDADE','MOTIVO','DETALHES DO MOTIVO','FOTOS','OBSERVAÇÃO','REGISTRADO POR'];
 const r4=recs.map(r=>[fmtD(r.data),r.nf||'',r.contrato||'',r.fornecedor||'',r.nm||'',r.plataforma||'',r.descricao||'',+r.quantidade||0,r.unidade||'',r.motivoTipo||'',r.motivo||'',+r.fotos||0,r.observacao||'',r.criadoPor||'']);
 const ws4=X.utils.aoa_to_sheet([H4,...r4]);fmtCols(X,ws4,r4.length,[],[7]);
 ws4['!cols']=[12,14,14,22,12,14,36,11,9,24,40,7,30,18].map(w=>({wch:w}));
 ws4['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:r4.length,c:H4.length-1}})};
 const cnt=k=>mats.filter(m=>sit(m).st===k).length;
 const stc=k=>sds.filter(o=>o.x.status===k).length;
 const res=[[`${empresa().toUpperCase()} — RELATÓRIO DE MATERIAIS MPT`],[],['Gerado em',new Date().toLocaleString('pt-BR')],['Gerado por',S.user.nome],['Tipo',{todos:'Todos os materiais',estoque:'Em estoque',baixados:'Baixados'}[R.tipo]],['Contrato',R.ct||'Todos'],['Plataforma',R.plat||'Todas'],['Período',(R.de||R.ate)?`${fmtD(R.de)||'início'} a ${fmtD(R.ate)||'hoje'}`:'Todo o histórico'],[],
  ['Total de materiais',mats.length],['Em estoque',cnt('EM ESTOQUE')],['Saída parcial',cnt('PARCIAL')],['Baixados',cnt('BAIXADO')],[],
  ['Saídas registradas',sds.length],['Aplicação',stc('APLICAÇÃO')],['Embarque',stc('EMBARQUE')],['Transferência',stc('TRANSFERÊNCIA')],['Devolução',stc('DEVOLUÇÃO')],[],['NFs recusadas',recs.length],[],

 const ws3=X.utils.aoa_to_sheet(res);res.forEach((row,i)=>{if(String(row[0]||'').startsWith('Valor')){const c=X.utils.encode_cell({r:i,c:1});if(ws3[c])ws3[c].z='"R$" #,##0.00'}});ws3['!cols']=[{wch:28},{wch:30}];

 const buf=X.write(wb,{bookType:'xlsx',type:'array'});

 await saveFile(nm,buf);

function fmtCols(X,ws,n,money,qty){for(let r=1;r<=n;r++){money.forEach(c=>{const a=X.utils.encode_cell({r,c});if(ws[a])ws[a].z='"R$" #,##0.00'});qty.forEach(c=>{const a=X.utils.encode_cell({r,c});if(ws[a])ws[a].z='#,##0.###'})}}
function abToB64(buf){const bytes=new Uint8Array(buf);let out='';const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)out+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(out)}
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
async function saveFile(name,data){
 if(isNative()){
  try{
   const P=window.Capacitor.Plugins,FS=P.Filesystem,SH=P.Share;
   const b64=typeof data==='string'?btoa(unescape(encodeURIComponent(data))):abToB64(data instanceof ArrayBuffer?data:data.buffer);
   let docOk=false;try{await FS.writeFile({path:'Controle MPT/'+name,data:b64,directory:'DOCUMENTS',recursive:true});docOk=true}catch(e){}
   const r=await FS.writeFile({path:name,data:b64,directory:'CACHE'});
   toast(docOk?'Arquivo salvo em Documentos › Controle MPT':'Arquivo gerado');
   try{await SH.share({title:name,url:r.uri,dialogTitle:'Enviar ou salvar o arquivo'})}catch(e){}
  }catch(e){toast('Não foi possível salvar o arquivo: '+(e.message||e),'err')}
  return;
 }
 try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast('Download iniciado: '+name)}
 catch(e){toast('Download indisponível neste dispositivo.','err')}
}

 let logo=null;const c=cfg();if(c.logo){logo={src:c.logo,w:c.logoW||300,h:c.logoH||100,t:c.logo.startsWith('data:image/png')?'PNG':'JPEG'}}
 list.forEach((m,i)=>{
  if(fmt==='a4'){const k=i%8;if(i&&k===0)doc.addPage();const col=k%2,row=Math.floor(k/2);drawLabel(doc,m,3+col*104,5.5+row*72,logo)}
  else{if(i)doc.addPage([100,70],'landscape');drawLabel(doc,m,0,0,logo)}
 });
 const buf=doc.output('arraybuffer');
 await saveFile(list.length===1?`Etiqueta_${(list[0].codigo||'material').replace(/[^\w-]/g,'_')}.pdf`:`Etiquetas_${list.length}_${today()}.pdf`,buf);

function drawLabel(doc,m,X,Y,logo){
 const W=100,H=70,P=3.5;
 doc.setDrawColor(30);doc.setLineWidth(0.35);doc.roundedRect(X+0.6,Y+0.6,W-1.2,H-1.2,2.2,2.2);
 const hh=12.5;
 if(logo){const mw=34,mh=8.5;const r=Math.min(mw/logo.w,mh/logo.h);const w=logo.w*r,h=logo.h*r;try{doc.addImage(logo.src,logo.t,X+P,Y+2+(mh-h)/2,w,h)}catch(e){doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(empresa().toUpperCase(),X+P,Y+8.5)}}
 else{doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(0);doc.text(empresa().toUpperCase(),X+P,Y+8.6)}
 doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(7.6);doc.text('IDENTIFICAÇÃO DE MATERIAL',X+W-P,Y+6,{align:'right'});
 doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(90);doc.text('Controle de Materiais MPT',X+W-P,Y+9.3,{align:'right'});
 doc.setDrawColor(30);doc.setLineWidth(0.25);doc.line(X+1.2,Y+hh,X+W-1.2,Y+hh);
 const qs=26.5,qx=X+W-P-qs,qy=Y+hh+2.2;drawQR(doc,qrText(m),qx,qy,qs);
 doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(7.6);
 const cl=doc.splitTextToSize(String(m.codigo||''),qs+3).slice(0,2);doc.text(cl,qx+qs/2,qy+qs+3.6,{align:'center'});
 doc.setFont('helvetica','normal');doc.setFontSize(5.4);doc.setTextColor(90);
 doc.text(`Entrada ${fmtD(m.data)}`,qx+qs/2,qy+qs+3.6+cl.length*2.9+0.6,{align:'center'});
 const fx=X+P,fw=qx-3-fx,cw=fw/2;let y=Y+hh+1.6;
 const fld=(lab,val,x,w,lines)=>{doc.setFont('helvetica','normal');doc.setFontSize(5);doc.setTextColor(105);doc.text(lab.toUpperCase(),x,y+1.9);
  doc.setFont('helvetica','bold');doc.setFontSize(7.2);doc.setTextColor(0);let t=doc.splitTextToSize(String(val==null||val===''?'-':val),w-1);if(t.length>lines){t=t.slice(0,lines);t[lines-1]=t[lines-1].replace(/.{0,2}$/,'…')}doc.text(t,x,y+4.7);return t.length};
 const n=fld('Descrição',m.descricao,fx,fw,2);y+=4.6+n*2.75;
 const pairs=[['Data',fmtD(m.data),'Contrato',m.contrato],['NF',m.nf,'NM',m.nm],['RT',m.rt,'SS',m.ss],['Registro',m.registro,'Plataforma',m.plataforma],['Qtd / Unidade',fmtN(m.quantidade)+' '+(m.unidade||''),'Local',m.local],['Valor unitário',brl(m.valorUnit),'Valor total',brl(m.valorTotal)]];
 pairs.forEach(p=>{fld(p[0],p[1],fx,cw,1);fld(p[2],p[3],fx+cw,cw,1);y+=5.75});
 if(m.observacao){const rest=Y+H-2.2-(y+4.7);fld('Observação',m.observacao,fx,W-2*P,rest>2.6?2:1)}
}
function drawQR(doc,text,x,y,size){const q=makeQR(text),n=q.getModuleCount(),s=size/n;doc.setFillColor(0,0,0);
 for(let r=0;r<n;r++){let c=0;while(c<n){if(q.isDark(r,c)){const st=c;while(c<n&&q.isDark(r,c))c++;doc.rect(x+st*s,y+r*s,(c-st)*s+0.02,s+0.02,'F')}else c++}}}

/* ============ LEITURA DE QR ============ */
async function onQRFile(file){
 if(!file)return;toast('Lendo QR code…');
 try{await loadLib('jsqr')}catch(e){return toast(e.message,'err')}
 const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,1400/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
  const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  const res=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});
  if(!res||!res.data)return toast('QR code não encontrado na imagem. Tente uma foto mais próxima.','err');
  const t=res.data;const mi=t.match(/ID:([\w-]+)/);const mc=t.match(/COD:\s*([^\n]+)/);
  let m=mi&&getMat(mi[1]);if(!m&&mc)m=S.mats.find(x=>x.codigo===mc[1].trim());if(!m)m=S.mats.find(x=>x.codigo===t.trim());
  if(m){if(S.view!=='estoque')go('estoque');openDetail(m.id)}else{S.q=(mc?mc[1]:t).trim().slice(0,60);go('estoque');toast('Material não encontrado pelo QR — mostrando busca.','err')}};
 img.onerror=()=>toast('Imagem inválida.','err');img.src=url;
}
$('#qrFile').addEventListener('change',e=>{onQRFile(e.target.files[0]);e.target.value=''});

  try{await retry(()=>S.db.doc('materiais/'+m.id).delete());for(let i=0;i<(+m.fotos||0);i++)await S.db.doc('fotos/'+m.id+'-'+i).delete().catch(()=>{});S.sel.delete(m.id);closeModal();toast('Material excluído.')}catch(e){wErr(e)}},
 estornar:async b=>{const m=getMat(b.dataset.id);const i=+b.dataset.i;if(!m||!m.saidas[i])return;if(!(await confirmBox(`Estornar a saída de ${fmtN(m.saidas[i].quantidade)} ${m.unidade||''} (${m.saidas[i].status})? O saldo volta ao estoque.`,'Estornar',1)))return;
  const sd=m.saidas.filter((_,k)=>k!==i);try{await retry(()=>S.db.doc('materiais/'+m.id).update({saidas:sd,atualizadoPor:S.user.nome,atualizadoEm:Date.now()}));toast('Saída estornada.')}catch(e){wErr(e)}},
 labelOne:b=>{gerarPDF([b.dataset.id])},
 goLabels:()=>go('etiquetas'),clearSel:()=>{S.sel.clear();S.view==='estoque'?renderList():renderView()},
 labAll:()=>{const q=S.lab.q.trim().toLowerCase();S.mats.forEach(m=>{if(!q||[m.codigo,m.descricao,m.nf,m.nm,m.plataforma,m.local].join(' ').toLowerCase().includes(q))S.sel.add(m.id)});renderView()},
 labFmt:b=>{S.lab.fmt=b.dataset.f;renderView()},pdfLabels:()=>gerarPDF([...S.sel]),
 clearF:()=>{S.q='';S.fSit='';S.fPlat='';renderView()},
 scanQR:()=>{closeModal();$('#qrFile').click()},
 dashP:b=>{S.dash.p=b.dataset.p;renderView()},dashClr:()=>{S.dash.ct='';S.dash.plat='';renderView()},
 repTipo:b=>{S.rep.tipo=b.dataset.t;renderView()},excel:()=>gerarExcel(),
 newUser:()=>newUserModal(),
 resetPw:async b=>{const u=S.users.find(x=>x.id===b.dataset.u);if(!u||!u.email)return;if(!(await confirmBox(`Enviar para ${u.email} um link para criar uma nova senha?`,'Enviar')))return;try{await S.auth.sendPasswordResetEmail(u.email);toast('Link de redefinição enviado para '+u.email)}catch(e){toast(authMsg(e),'err')}},
 toggleUser:async b=>{const u=S.users.find(x=>x.id===b.dataset.u);if(!u)return;try{await retry(()=>S.db.doc('usuarios/'+u.id).update({ativo:u.ativo===false}));toast(u.ativo===false?'Usuário ativado.':'Usuário desativado.')}catch(e){wErr(e)}},
 makeAdmin:async b=>{const u=S.users.find(x=>x.id===b.dataset.u);if(!u)return;if(u.ativo===false)return toast('Ative o usuário antes.','err');
  if(!(await confirmBox(`Transferir a administração para ${u.nome}? Só pode existir um administrador — você passará a ser usuário comum.`,'Transferir',1)))return;
  try{const bt=S.db.batch();bt.update(S.db.doc('usuarios/'+u.id),{perfil:'admin'});bt.update(S.db.doc('usuarios/'+S.user.id),{perfil:'usuario'});bt.set(S.db.doc('meta/admin'),{uid:u.id,criadoEm:Date.now()});await bt.commit();S.user=Object.assign({},S.user,{perfil:'usuario'});toast('Administração transferida.');render();go('dashboard')}catch(e){wErr(e)}},
 delUser:async b=>{const u=S.users.find(x=>x.id===b.dataset.u);if(!u)return;if(!(await confirmBox(`Excluir o usuário ${u.nome} (${u.email||''})? Ele perde o acesso. Os registros feitos por ele são mantidos.`,'Excluir',1)))return;try{await retry(()=>S.db.doc('usuarios/'+u.id).delete());toast('Usuário excluído.')}catch(e){wErr(e)}},
 exportBk:()=>exportBackup().catch(e=>toast('Erro no backup: '+(e.message||e),'err')),
 rmLogo:async()=>{if(await confirmBox('Remover a logo?','Remover',1)){const c=Object.assign({},cfg());delete c.logo;delete c.logoW;delete c.logoH;try{await retry(()=>S.db.doc('config/geral').set(c));toast('Logo removida.')}catch(e){wErr(e)}}}
};
function zoomImg(u){const r=document.createElement('div');r.className='ov';r.style.zIndex=70;r.style.alignItems='center';r.innerHTML=`<img class="imgview" src="${u}">`;r.addEventListener('click',()=>r.remove());document.body.appendChild(r)}
const CHG={
 dashPlat:e=>{S.dash.plat=e.value;renderView()},dashCt:e=>{S.dash.ct=e.value;renderView()},dashDe:e=>{S.dash.de=e.value;renderView()},dashAte:e=>{S.dash.ate=e.value;renderView()},
 fSit:e=>{S.fSit=e.value;renderList()},fPlat:e=>{S.fPlat=e.value;renderList()},
 sel:e=>{e.checked?S.sel.add(e.dataset.id):S.sel.delete(e.dataset.id);if(S.view==='estoque')renderList();else renderView()},
 repCt:e=>{S.rep.ct=e.value;renderView()},rCt:e=>{S.rCt=e.value;renderRecList()},
 selAll:e=>{const L=filtered();L.forEach(m=>e.checked?S.sel.add(m.id):S.sel.delete(m.id));renderList()},
 repPlat:e=>{S.rep.plat=e.value;renderView()},repDe:e=>{S.rep.de=e.value;renderView()},repAte:e=>{S.rep.ate=e.value;renderView()},
 fotos:async e=>{const all=[...e.files];const files=all.slice(0,4-S.fotos.length);e.value='';if(all.length>files.length)toast('Máximo de 4 fotos por material.','err');if(files.length)toast('Processando foto(s)…');for(const f of files){try{S.fotos.push(await compressImg(f));S._fotosDirty=true;if(!S._fotosLoading)S._fotosLoaded=true}catch(x){toast('Não foi possível ler a imagem.','err')}}renderFotos()},
 logo:e=>{onLogo(e.files[0]);e.value=''},
 importBk:e=>{const f=e.files[0];e.value='';importBackup(f)}
};
const INP={
 q:e=>{S.q=e.value;renderList()},
 rq:e=>{S.rq=e.value;renderRecList()},
 labq:e=>{S.lab.q=e.value;const q=e.value.trim().toLowerCase();const L=S.mats.filter(m=>!q||[m.codigo,m.descricao,m.nf,m.nm,m.plataforma,m.local].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));const l=$('#labList');if(l)l.innerHTML=labListHTML(L)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(!f)return;if(b.tagName==='A')e.preventDefault();f(b,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg]){e.stopPropagation();CHG[t.dataset.chg](t)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.inp&&INP[t.dataset.inp])INP[t.dataset.inp](t)});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&f.dataset.form&&FORMS[f.dataset.form]){e.preventDefault();Promise.resolve(FORMS[f.dataset.form](f)).catch(err=>toast('Erro: '+(err&&err.message||err),'err'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// checkbox dentro de linha clicável não abre detalhe
document.addEventListener('click',e=>{if(e.target.matches('td.ck input,td.ck'))e.stopPropagation()},true);

init();
</script>
</body>
</html>
